openapi: 3.0.3
info:
  title: Laravel
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://45.136.56.228:8000'
paths:
  /api/auth/register:
    post:
      summary: Регистрация
      operationId: ''
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: ''
                  example: enim
              required:
                - phone
      security: []
  /api/auth/login:
    post:
      summary: Авторизация
      operationId: ''
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: ''
                  example: ad
                code:
                  type: string
                  description: ''
                  example: eius
              required:
                - phone
                - code
      security: []
  /api/banner/update:
    post:
      summary: Обновление
      operationId: ''
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Banner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                banners:
                  type: array
                  description: ''
                  example:
                    - eligendi
                  items:
                    type: string
              required:
                - banners
      security: []
  /api/banner/store:
    post:
      summary: Создание
      operationId: ''
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Banner
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: 'Must be an image. Must not be greater than 10000 kilobytes.'
              required:
                - image
      security: []
  '/api/banner/delete/{id}':
    delete:
      summary: Удаление
      operationId: ''
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Banner
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the delete.'
        example: ipsa
        required: true
        schema:
          type: string
